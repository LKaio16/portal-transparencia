# Baixa os dados da Câmara, do Senado e as notícias todo dia, salva no repositório e envia os alertas.
# Se o site estiver na Vercel ligado a este repositório, cada commit dispara um novo deploy.
# Os dados do TSE (npm run coletar:tse e coletar:tse-local) não mudam todo dia e são atualizados manualmente.
name: Coletar dados

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      # Segredos não podem ser usados direto em "if"; estes indicadores dizem quais etapas opcionais rodam.
      TEM_IA: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      TEM_ALERTAS: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coletar
      - run: npm run coletar:noticias
      # Atividade nas Assembleias Legislativas com dados abertos. Se uma estiver fora do ar, as outras seguem.
      - run: npm run coletar:assembleias
      - name: Resumir propostas novas
        if: env.TEM_IA == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run resumir
      - run: npm run validar-curadoria
      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "Atualiza dados ($(date +%F))"
          git push
      - name: Enviar alertas por e-mail
        if: env.TEM_ALERTAS == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SEGREDO_SITE: ${{ secrets.SEGREDO_SITE }}
        run: npm run alertas
