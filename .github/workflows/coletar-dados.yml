# Baixa os dados da Câmara todo dia e salva no repositório.
# Se o site estiver na Vercel ligado a este repositório, cada commit dispara um novo deploy.
name: Coletar dados da Câmara

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coletar
      # Resume as propostas novas do dia (só roda se o segredo ANTHROPIC_API_KEY estiver configurado no repositório).
      # Os dados do TSE (npm run coletar:tse) não mudam todo dia e são atualizados manualmente.
      - name: Resumir propostas novas
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run resumir
      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "Atualiza dados da Câmara ($(date +%F))"
          git push
